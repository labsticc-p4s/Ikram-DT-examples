services:
  kafka:
    image: apache/kafka:3.7.0
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 10

  strain-service:
    build: ./strain-service
    ports: ["8085:8085"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GREYCAT_URL: http://host.docker.internal:8080
    depends_on:
      kafka:
        condition: service_healthy

  bioreactor-mock-service:
    build: ./bioreactor-mock-service
    ports: ["8081:8081"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GREYCAT_URL: http://host.docker.internal:8080
      REACTOR_CSV_PATH: /app/demo.csv
    depends_on:
      kafka:
        condition: service_healthy

  experiment-service:
    build: ./experiment-service
    ports: ["8087:8087"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GREYCAT_URL: http://host.docker.internal:8080
    depends_on:
      kafka:
        condition: service_healthy

  models-service:
    build: ./models-service
    ports: ["8084:8084"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GREYCAT_URL: http://host.docker.internal:8080
      STRAIN_SERVICE_URL: http://strain-service:8085
    depends_on:
      kafka:
        condition: service_healthy
      strain-service:
        condition: service_started

  gateway-service:
    build: ./gateway-service
    ports: ["8086:8086"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GREYCAT_URL: http://host.docker.internal:8080
      STRAIN_SERVICE_URL: http://strain-service:8085
      PHYSICAL_SERVICE_URL: http://bioreactor-mock-service:8081
      MODELS_SERVICE_URL: http://models-s